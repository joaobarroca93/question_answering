[tool.poetry]
name = "question_answering"
version = "0.1.0"
description = ""
authors = ["Joao Barroca"]
readme = "README.md"
packages = [
    {include = "src"},
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pandas = "^2.1.1"
nltk = "^3.8.1"
pyldavis = "^3.4.1"
rank-eval = "^0.1.3"
chromadb = "^0.4.13"
sentence-transformers = "^2.2.2"
streamlit = "^1.27.1"
watchdog = "^3.0.0"
ipywidgets = "^8.1.1"
datasets = "^2.14.5"
huggingface-hub = "^0.18.0"
transformers = "^4.35.2"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.5.1"
pytest = "^8.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["type-abstract", "override"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
