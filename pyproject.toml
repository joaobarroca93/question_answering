[tool.poetry]
name = "question_answering"
version = "0.1.0"
description = ""
authors = ["Joao Barroca"]
readme = "README.md"
packages = [
    {include = "src"},
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.1.1"
nltk = ">=3.10.3,<4.0.0"
pyldavis = "^3.4.1"
rank-eval = "^0.1.3"
chromadb = ">=1.5.0,<2.0.0"
sentence-transformers = ">=5.6.0,<6.0.0"
streamlit = ">=1.65.0,<2.0.0"
watchdog = "^3.0.0"
ipywidgets = "^8.1.1"
datasets = "^2.14.5"
huggingface-hub = ">=1.5.0,<3.0.0"
transformers = ">=5.10.0,<6.0.0"
# Explicit security floors for transitively installed runtime packages.
anyio = ">=4.14.2,<5.0.0"
gitpython = ">=3.1.60,<4.0.0"
h11 = ">=0.16.0,<1.0.0"
pillow = ">=12.3.0,<13.0.0"
sentencepiece = ">=0.2.1,<1.0.0"
torch = ">=2.13.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.5.1"
pytest = "^8.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["type-abstract", "override"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
